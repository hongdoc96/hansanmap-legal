# 동네별 SEO 랜딩 주간 재빌드 — 획득 계획 L2의 '주 1회 재빌드' 규약을 무인화 (2026-08-20)
#
# 왜 이 저장소인가: 빌더는 표준 라이브러리 + anon 키(RLS 보호 공개 키)만 쓰는 자립형이고,
# 산출물 소비처가 이 GitHub Pages 저장소뿐이다. 이 저장소는 public 이라 Actions 분 무료 —
# 앱 저장소(사설, 월 2,000분)와 달리 분 소진 걱정이 없다.
# KST 월요일 03:30 (트래픽 최저 시간대) = UTC 일요일 18:30.
name: rebuild-places
on:
  schedule:
    - cron: '30 18 * * 0'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 재빌드 (typicals 요일×시간 히트맵 갱신)
        run: python3 scripts/build_place_pages.py .
      # 계약 — 여기서 실패하면 커밋하지 않는다(거짓 문장·위조 가능한 제목·막다른 링크를 배포하느니
      # 옛 페이지가 낫다). 같은 검사를 PR 마다 checks.yml 이 돌린다.
      - name: 착지 페이지 계약 검사
        run: |
          python3 scripts/check_landing.py .
          python3 scripts/check_landing.py . --self-test
          node scripts/verify_landing.js place/index.html
      - name: 동네 페이지 계약 검사 (주장 ↔ 히트맵 대조 · 링크 · 색인 여부)
        run: |
          python3 scripts/check_places.py .
          python3 scripts/check_places.py . --self-test
          node scripts/verify_place.js .
      - name: 변경 있으면 커밋·푸시 (GitHub Pages 가 자동 배포)
        run: |
          git config user.name "hansanmap-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "변경 없음 — 커밋 생략" || {
            git commit -m "auto: 주간 SEO 랜딩 재빌드 ($(date -u +%F))"
            git push
          }
      # 오늘(KST) 바뀐 URL 만 — 빌더가 내용이 그대로인 페이지의 lastmod 를 유지한다.
      - name: 검색엔진에 색인 통보 (IndexNow — Bing·네이버·Seznam·Yandex)
        run: python3 scripts/submit_indexnow.py . --since "$(TZ=Asia/Seoul date +%F)"
