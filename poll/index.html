<!DOCTYPE html>
<!--
  한산맵 '어디 갈까' 단체 투표(바이럴 V2) 페이지.
  호스팅 위치: https://hongdoc96.github.io/hansanmap-legal/poll/index.html

  ⚠️ 이 경로는 App Links / Universal Links 에 **일부러 넣지 않는다.**
     넣으면 앱 설치자에게서 OS 가 링크를 가로채 앱으로 보내는데, 이 페이지의 존재 이유는
     "설치 없이 웹에서 투표까지 완결"이다. 카톡방의 미설치자가 곧바로 참여할 수 있어야
     응답 요구형 1:N 공유가 성립한다.

  투표자 식별은 브라우저가 만든 난수(localStorage)뿐 — 계정도 IP 도 쓰지 않는다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>어디 갈까? — 한산맵 투표</title>
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="한산맵" />
  <meta property="og:title" content="어디 갈까? 투표해주세요 — 한산맵" />
  <meta property="og:description" content="지금 실시간 혼잡도를 보고 고르세요. 설치 없이 바로 투표할 수 있어요." />
  <meta property="og:image" content="https://hongdoc96.github.io/hansanmap/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <style>
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
           background: #F4F6F8; color: #1B2733; margin: 0; padding: 0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .card { background: #fff; border-radius: 16px; padding: 26px 22px; max-width: 380px; width: 88%;
            box-shadow: 0 6px 24px rgba(0,0,0,.08); }
    h1 { font-size: 19px; margin: 0 0 4px; text-align: center; }
    .sub { font-size: 12.5px; color: #8595A5; margin: 0 0 18px; text-align: center; }
    /* 후보 1개 — 이름 + 지금 혼잡도 + 표수 막대. 투표 전엔 통째로 버튼. */
    .opt { border: 1.5px solid #E4E9EF; border-radius: 12px; padding: 13px 14px; margin: 0 0 10px;
           cursor: pointer; position: relative; overflow: hidden; background: #fff;
           -webkit-tap-highlight-color: transparent; }
    .opt.mine { border-color: #2F6BFF; background: #F4F8FF; }
    .opt .bar { position: absolute; left: 0; top: 0; bottom: 0; background: #EAF0FF; width: 0;
                transition: width .45s ease; z-index: 0; }
    .opt .row { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 8px; }
    .opt .nm { font-size: 15px; font-weight: 800; }
    .opt .lv { font-size: 12.5px; font-weight: 700; }
    .opt .ct { margin-left: auto; font-size: 13px; font-weight: 700; color: #5B6B7B; }
    .opt .why { position: relative; z-index: 1; font-size: 11.5px; color: #8595A5; margin-top: 3px; }
    .note { font-size: 11.5px; color: #8595A5; text-align: center; margin: 14px 0 0; }
    a.btn { display: block; text-decoration: none; font-weight: 700; font-size: 14px;
            border-radius: 10px; padding: 12px 0; margin: 14px 0 0; text-align: center;
            background: #EAF0F7; color: #2F6BFF; }
    #err { display: none; font-size: 13px; color: #8595A5; text-align: center; padding: 8px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">어디 갈까?</h1>
    <p class="sub" id="sub">불러오는 중…</p>
    <div id="opts"></div>
    <p id="err">투표를 찾을 수 없어요. 링크가 만료됐을 수 있어요.</p>
    <p class="note" id="note"></p>
    <a class="btn" id="storeLink" href="https://play.google.com/store/apps/details?id=kr.hongdoc.hansanmap">한산맵 앱 받기</a>
  </div>
  <script>
    (function () {
      var SB = 'https://zrvuucvjcmlcvhhvfzzd.supabase.co';
      var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpydnV1Y3ZqY21sY3ZoaHZmenpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQwNjIsImV4cCI6MjA5NjYxMDA2Mn0.PgwGvh1qS27t7AcepWtIm26MlZ6KkrplAOIMfRHgKFQ';
      var RANK = { '여유': 0, '보통': 1, '약간붐빔': 2, '붐빔': 3 };
      var EMO = { '여유': '🟢', '보통': '🟡', '약간붐빔': '🟠', '붐빔': '🔴' };
      function norm(l) { return String(l == null ? '' : l).replace(/\s/g, ''); }

      var id = new URLSearchParams(window.location.search || '').get('id');
      var optsEl = document.getElementById('opts');
      var subEl = document.getElementById('sub');
      var noteEl = document.getElementById('note');

      // iOS 는 App Store 로(랜딩 페이지와 동일 규약)
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        document.getElementById('storeLink')
          .setAttribute('href', 'https://apps.apple.com/app/id6783810617');
      }

      // 투표자 키 — 브라우저 난수. 계정·IP 아님. 같은 기기가 다시 누르면 '변경'이 되게 하는 용도뿐.
      function voterKey() {
        try {
          var k = localStorage.getItem('hansan_voter_key');
          if (!k) {
            k = 'v' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
            localStorage.setItem('hansan_voter_key', k);
          }
          return k;
        } catch (e) {
          // 프라이빗 모드 등 — 세션 한정 키(새로고침하면 새 사람이 된다. 표가 겹칠 뿐 무해)
          return 'v' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
        }
      }
      var VK = voterKey();

      function rpc(fn, body) {
        return fetch(SB + '/rest/v1/rpc/' + fn, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': ANON,
                     'Authorization': 'Bearer ' + ANON },
          body: JSON.stringify(body || {})
        }).then(function (r) { return r.json(); });
      }

      function fail() {
        subEl.style.display = 'none';
        document.getElementById('err').style.display = 'block';
      }

      if (!id) { fail(); return; }

      var state = null;   // 마지막으로 받은 투표 상태
      var levels = {};    // areaCode → 서울시 현재 혼잡 단계

      // 후보들의 **지금 혼잡도** — 이게 이 페이지의 본체다. 투표하려면 실시간 혼잡도를 보게 된다.
      // 실패하면 혼잡도만 빠지고 투표는 그대로 된다(억지 표시 금지).
      function loadLevels() {
        return rpc('list_seoul_area_status').then(function (rows) {
          if (!rows || !rows.length) return;
          for (var i = 0; i < rows.length; i++) {
            levels[rows[i].area_code] = rows[i].congestion_level;
          }
        }).catch(function () {});
      }

      function render() {
        if (!state) return fail();
        var cands = state.candidates || [];
        var tallies = state.tallies || [];
        var total = state.total || 0;
        var voted = state.my_choice !== null && state.my_choice !== undefined;

        subEl.textContent = state.expired
          ? '마감된 투표예요 · ' + total + '명 참여'
          : (voted ? '투표 완료 · ' + total + '명 참여 (다시 누르면 바꿀 수 있어요)'
                   : '지금 혼잡도를 보고 골라주세요 · ' + total + '명 참여');

        optsEl.innerHTML = '';
        // 가장 한산한 후보를 표시로 알려준다 — '추천'이 아니라 사실 서술(정직성).
        var bestRank = 99;
        for (var i = 0; i < cands.length; i++) {
          var r = RANK[norm(levels[cands[i].code])];
          if (r !== undefined && r < bestRank) bestRank = r;
        }
        for (var i = 0; i < cands.length; i++) {
          (function (idx) {
            var c = cands[idx];
            var cnt = tallies[idx] || 0;
            var lvl = levels[c.code];
            var rk = RANK[norm(lvl)];
            var el = document.createElement('div');
            el.className = 'opt' + (state.my_choice === idx ? ' mine' : '');

            var bar = document.createElement('div');
            bar.className = 'bar';
            el.appendChild(bar);

            var row = document.createElement('div');
            row.className = 'row';
            var nm = document.createElement('span');
            nm.className = 'nm';
            nm.textContent = c.name;
            row.appendChild(nm);
            if (lvl) {
              var lv = document.createElement('span');
              lv.className = 'lv';
              lv.textContent = (EMO[norm(lvl)] || '⚪') + ' ' + lvl;
              row.appendChild(lv);
            }
            var ct = document.createElement('span');
            ct.className = 'ct';
            ct.textContent = cnt + '표';
            row.appendChild(ct);
            el.appendChild(row);

            // 지금 가장 한산한 후보에만 한 줄 — 여러 곳이 동률이면 전부 붙는다(거짓 단독 1위 금지).
            if (rk !== undefined && rk === bestRank && cands.length > 1) {
              var why = document.createElement('div');
              why.className = 'why';
              why.textContent = '지금 이 중 가장 한산해요';
              el.appendChild(why);
            }

            // 막대는 렌더 후 한 프레임 뒤에 늘려야 transition 이 보인다.
            setTimeout(function () {
              bar.style.width = total > 0 ? Math.round((cnt / total) * 100) + '%' : '0%';
            }, 30);

            if (!state.expired) {
              el.onclick = function () { vote(idx); };
            } else {
              el.style.cursor = 'default';
            }
            optsEl.appendChild(el);
          })(i);
        }

        noteEl.textContent = state.expired
          ? '혼잡도는 서울시 실시간 도시데이터 기준이에요.'
          : '혼잡도는 지금 기준이에요 · 서울시 실시간 도시데이터';
      }

      function load() {
        return rpc('get_group_poll', { p_poll_id: id, p_voter_key: VK })
          .then(function (rows) {
            var row = rows && rows[0];
            if (!row || !row.candidates) { fail(); return; }
            state = row;
            render();
          })
          .catch(fail);
      }

      function vote(idx) {
        if (!state || state.expired) return;
        // 낙관적 반영 — 누른 즉시 내 표가 옮겨간 것처럼 보이게 하고, 서버 응답으로 확정한다.
        var prev = state.my_choice;
        if (prev !== idx) {
          state.tallies = (state.tallies || []).slice();
          if (prev !== null && prev !== undefined) {
            state.tallies[prev] = Math.max(0, (state.tallies[prev] || 0) - 1);
          } else {
            state.total = (state.total || 0) + 1;
          }
          state.tallies[idx] = (state.tallies[idx] || 0) + 1;
          state.my_choice = idx;
          render();
        }
        rpc('vote_group_poll', { p_poll_id: id, p_voter_key: VK, p_choice: idx })
          .then(function () { return load(); })   // 서버 확정값으로 재동기화
          .catch(function () { load(); });
      }

      loadLevels().then(load);
    })();
  </script>
</body>
</html>
