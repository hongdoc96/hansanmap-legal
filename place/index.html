  <script>
    // 현재 https URL의 쿼리를 커스텀 스킴으로 변환해 앱 열기 시도(미설치면 아무 일 없음).
    (function () {
      var qs = window.location.search || '';
      var scheme = 'kr.hongdoc.hansanmap://place' + qs;
      document.getElementById('openApp').setAttribute('href', scheme);
      // 공유 링크 라이브 혼잡도(확장 P1) — 동네(area 코드) 링크면 Supabase 공개(anon) RPC로
      // 현재 혼잡 단계를 표시. 받는 사람이 앱 설치 전에 가치를 먼저 봄(카톡방 전파 루프).
      // anon 키는 앱에도 내장된 공개 키(RLS 보호) — 서버 비밀 아님. 실패 시 조용히 미표시.
      // 서울시 4단계 순위 — 클수록 붐빔. 대안은 '지금보다 낮은 단계'만 고른다(앱 대안칩과 동일 기준).
      // ⚠️ 실제 반환값은 공백 없는 '약간붐빔' — 앱 isStdCrowdLabel 과 같은 정규화(공백 제거)를 거쳐 찾는다.
      var RANK = { '여유': 0, '보통': 1, '약간붐빔': 2, '붐빔': 3 };
      function norm(l) { return String(l == null ? '' : l).replace(/\s/g, ''); }
      function rankOf(l) { return RANK[norm(l)]; }

      // 공유 설치 이어받기(F1, 2026-09-29) — Play 링크에 동네 코드를 실어 보낸다.
      //   Play 는 설치 뒤 90일간 이 문자열(Install Referrer)을 앱에 건넨다. 앱은 첫 실행에서 읽어
      //   온보딩 뒤 이 동네로 착지한다 — 형식은 앱 lib/core/utils/install_referrer.dart 와 같다.
      //   utm_* 는 Play Console 획득 보고서가 그대로 센다(공유로 온 설치 수).
      //   ⚠️ 모르는 코드는 싣지 않는다 — 제목과 같은 규약(AREA_NAMES 가 유일한 근거).
      //   ⚠️ App Store 는 설치 경로를 앱에 넘기지 않는다 — iOS 는 아래 안내 한 줄이 대신한다.
      var PLAY = 'https://play.google.com/store/apps/details?id=kr.hongdoc.hansanmap';
      function storeLinkFor(ios, search) {
        if (ios) return 'https://apps.apple.com/app/id6783810617';
        var p = new URLSearchParams(search);
        var a = p.get('area');
        if (!a || !AREA_NAMES[a]) return PLAY;
        var r = 'utm_source=hansan_share&utm_medium=landing&area=' + a;
        // 초대 귀속 토큰(V7) — 앱과 같은 형식(hex 12자)만 싣는다. 계측 속성일 뿐이라 없어도 착지는 한다.
        var ref = p.get('ref');
        if (ref && /^[0-9a-f]{12}$/.test(ref)) r += '&ref=' + ref;
        return PLAY + '&referrer=' + encodeURIComponent(r);
      }
      // 설치 뒤 돌아오는 길 — 아는 동네 링크일 때만. 이름은 URL 이 아니라 표에서 온다(제목과 같다).
      function installHintFor(search) {
        var a = new URLSearchParams(search).get('area');
        var k = a ? AREA_NAMES[a] : null;
        if (!k) return null;
        return "설치한 뒤 이 페이지로 돌아와 '앱에서 열기'를 누르면 " + k[0] + ' 화면이 바로 열려요.';
      }

      // Supabase 공개(anon) RPC 호출 한 겹 — 세 호출이 같은 헤더를 쓴다.
      function rpc(SB, ANON, fn, body) {
        return fetch(SB + '/rest/v1/rpc/' + fn, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': ANON,
                     'Authorization': 'Bearer ' + ANON },
          body: JSON.stringify(body || {})
        }).then(function (r) { return r.json(); });
      }

      // 두 좌표 사이 거리(m) — 하버사인(앱 GeoDistance 와 같은 정의).
      function meters(la1, ln1, la2, ln2) {
        var R = 6371000, t = Math.PI / 180;
        var dLa = (la2 - la1) * t, dLn = (ln2 - ln1) * t;
        var a = Math.sin(dLa / 2) * Math.sin(dLa / 2) +
                Math.cos(la1 * t) * Math.cos(la2 * t) * Math.sin(dLn / 2) * Math.sin(dLn / 2);
        return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
      }

      function distLabel(d) {
        return d < 1000 ? Math.round(d) + 'm' : (d / 1000).toFixed(1) + 'km';
      }

      // 붐비는 링크 승격(확장 V3) — 링크가 '지금 붐빔'에서 끝나면 받는 사람은 막다른 길에 선다.
      //   ① 근처 더 한산한 곳 2곳  ② 언제 풀리는지
      // 둘 다 실패하면 조용히 기존 한 줄만 남는다(억지 표시 금지 — 앱과 같은 침묵 규약).
      function upgradeBusy(area, SB, ANON) {
        rpc(SB, ANON, 'list_seoul_area_status').then(function (rows) {
          if (!rows || !rows.length) return;
          var self = null, i;
          for (i = 0; i < rows.length; i++) {
            if (rows[i].area_code === area) { self = rows[i]; break; }
          }
          if (!self || self.lat == null || self.lng == null) return;
          var myRank = rankOf(self.congestion_level);
          if (myRank === undefined) return;
          // 3km 이내 · 지금보다 한 단계 이상 한산한 곳만, 가까운 순 2곳.
          var alts = [];
          for (i = 0; i < rows.length; i++) {
            var c = rows[i];
            if (c.area_code === area || c.lat == null || c.lng == null) continue;
            var r = rankOf(c.congestion_level);
            if (r === undefined || r >= myRank) continue;
            var d = meters(self.lat, self.lng, c.lat, c.lng);
            if (d <= 3000) alts.push({ name: c.area_name, lvl: c.congestion_level, r: r, d: d });
          }
          // 한산한 순 → 같으면 가까운 순. 거리만으로 뽑으면 '111m 앞 약간붐빔'처럼 체감 개선이 없는
          // 곳이 1순위가 된다(어차피 3km 이내 후보라 거리차보다 단계차가 결정을 더 바꾼다).
          alts.sort(function (a, b) { return a.r !== b.r ? a.r - b.r : a.d - b.d; });
          if (alts.length) {
            var box = document.getElementById('liveAlts');
            var h = document.createElement('p');
            h.className = 'h';
            h.textContent = '근처 더 한산한 곳';
            box.appendChild(h);
            for (i = 0; i < Math.min(2, alts.length); i++) {
              var p = document.createElement('p');
              p.className = 'a';
              p.textContent = alts[i].name;
              var sp = document.createElement('span');
              sp.className = 'd';
              sp.textContent = ' ' + distLabel(alts[i].d) + ' · ' + alts[i].lvl;
              p.appendChild(sp);
              box.appendChild(p);
            }
            box.style.display = 'block';
          }
          // 이름은 URL 문자열이 아니라 방금 받은 area_name 을 쓴다 — 공유 링크의 name 은 표시용이라
          // 예측 RPC 의 동네명과 어긋날 수 있고, 어긋나면 조용히 0행이 돌아온다.
          if (self.area_name) easeAt(self.area_name, myRank, SB, ANON);
        }).catch(function () { /* 미표시 */ });
      }

      // 언제 풀리는지 — 12시간 예측에서 '지금보다 낮은 단계가 지속되는' 첫 시각(앱과 동일 규약).
      // 한 시간 반짝 낮아지는 값으로 약속을 만들지 않는다.
      function easeAt(areaName, myRank, SB, ANON) {
        rpc(SB, ANON, 'get_seoul_area_forecast', { p_area_name: areaName }).then(function (rows) {
          if (!rows || !rows.length) return;
          var pts = [], i;
          for (i = 0; i < rows.length; i++) {
            if (rows[i].is_current || !rows[i].target_at) continue;
            pts.push({ at: new Date(rows[i].target_at), rank: rankOf(rows[i].level) });
          }
          pts.sort(function (a, b) { return a.at - b.at; });
          for (i = 0; i < pts.length; i++) {
            if (pts[i].rank === undefined || pts[i].rank >= myRank) continue;
            var next = pts[i + 1];
            if (next && (next.rank === undefined || next.rank >= myRank)) continue;
            // 시각은 KST 고정 — 브라우저 시간대가 어디든 서울 벽시계로 읽혀야 한다.
            var kst = new Date(pts[i].at.getTime() + 9 * 3600 * 1000);
            var el = document.getElementById('liveEase');
            el.textContent = kst.getUTCHours() + '시 이후 풀릴 것으로 예상돼요';
            el.style.display = 'block';
            return;
          }
        }).catch(function () { /* 미표시 */ });
      }

      try {
        var params = new URLSearchParams(qs);
        var area = params.get('area');
        // 🔴 제목은 **URL 을 믿지 않는다**(2026-09-15).
        //   `?area=POI054&name=홍대` 면 제목만 '홍대' 가 되고 바로 아래 혼잡도 카드는 혜화역 값이었다.
        //   링크를 만드는 사람이 우리 브랜드·서울시 실데이터·설치 버튼 위에 아무 문장이나 얹을 수 있다.
        //   같은 규약이 이 파일 안에 이미 있었다 — 대안 목록은 URL 이 아니라 area_name 을 쓴다(위).
        //   동네(area)면 코드→이름은 빌드 시 박은 AREA_NAMES 가 유일한 근거다.
        //   ⚠️ 모르는 코드에서 URL 로 폴백하면 구멍이 그대로 남는다 — **이름을 지어내지 않는다.**
        var known = area ? AREA_NAMES[area] : null;
        // 매장 링크는 area 가 없고 대조할 실데이터도 없다(라이브 카드도 안 뜬다).
        // 이름이 그것뿐이라 그대로 쓰되, 제목 자리를 길게 점유하지 못하게 다듬는다.
        var name = known ? known[0] : (area ? null : params.get('name'));
        if (name) {
          name = name.replace(/\s+/g, ' ').trim();
          if (name.length > 40) name = name.slice(0, 40) + '…';
        }
        if (name) {
          document.getElementById('title').textContent = name + ' — 한산맵에서 보기';
        }
        // 앱이 없는 사람에게도 볼 것을 준다 — 그 동네의 평소 요일·시간대 패턴 페이지.
        // 이름이 확정된 지금에야 안전하다(URL 이름으로 경로를 만들면 없는 페이지로 보낸다).
        if (known) {
          var more = document.getElementById('areaPage');
          more.setAttribute('href', encodeURIComponent(known[1]) + '/');
          more.textContent = known[0] + ' 평소 혼잡도 보기 →';
          more.style.display = 'block';
        }
        if (area) {
          var SB = 'https://zrvuucvjcmlcvhhvfzzd.supabase.co';
          var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpydnV1Y3ZqY21sY3ZoaHZmenpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQwNjIsImV4cCI6MjA5NjYxMDA2Mn0.PgwGvh1qS27t7AcepWtIm26MlZ6KkrplAOIMfRHgKFQ';
          fetch(SB + '/rest/v1/rpc/get_seoul_area_detail', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'apikey': ANON,
                       'Authorization': 'Bearer ' + ANON },
            body: JSON.stringify({ p_area_code: area })
          }).then(function (r) { return r.json(); }).then(function (rows) {
            var row = rows && rows[0];
            if (!row || !row.congest_lvl) return;
            // 서울시 단계 → 이모지 색(앱 신호색과 동일 의미)
            // 실제 반환값은 공백 없는 '약간붐빔' — 공백 포함 키로 찾던 탓에 이 단계가 ⚪ 로 떨어지고 있었다.
            var emo = { '여유': '🟢', '보통': '🟡', '약간붐빔': '🟠', '붐빔': '🔴' }[norm(row.congest_lvl)] || '⚪';
            var ageMin = row.updated_at
              ? Math.max(0, Math.round((Date.now() - new Date(row.updated_at).getTime()) / 60000))
              : null;
            // 2시간 넘게 낡은 값은 '지금'으로 단정하지 않음(앱 정직성 규약과 동일) — 미표시
            if (ageMin !== null && ageMin > 120) return;
            document.getElementById('liveLevel').textContent =
              '지금 ' + emo + ' ' + row.congest_lvl;
            document.getElementById('liveTime').textContent =
              ageMin === null ? '서울시 실시간 도시데이터 기준'
                              : ageMin + '분 전 · 서울시 실시간 도시데이터 기준';
            document.getElementById('live').style.display = 'block';
            // 붐빌 때만 '그래서 어디로 · 언제'까지 답한다(V3). 여유/보통이면 호출조차 안 한다
            // (한산한 곳에 대안을 들이대면 링크가 시끄러워지고 결정에 방해가 된다).
            if (rankOf(row.congest_lvl) >= 2) upgradeBusy(area, SB, ANON);
          }).catch(function () { /* 미표시 */ });
        }
      } catch (e) { /* 구형 브라우저 등 — 라이브 없이 기존 랜딩 동작 */ }
      // 스토어 버튼 — iOS 는 App Store, 그 외는 Play(rank6, OS별 정확한 설치 경로).
      // iPadOS 13+ 는 기본 UA 가 'Macintosh'(데스크톱 클래스)라 터치포인트로 보강 판별.
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      // 🔴 이 아래 자동 앱 열기(window.location.href)는 무슨 일이 있어도 실행돼야 한다 —
      //    구형 브라우저에서 URLSearchParams 가 없어 던지면 스토어 버튼만 기본값으로 둔다.
      try {
        document.getElementById('storeLink').setAttribute('href', storeLinkFor(isIOS, qs));
        var hint = installHintFor(qs);
        if (hint) {
          var hintEl = document.getElementById('installHint');
          hintEl.textContent = hint;
          hintEl.style.display = 'block';
        }
      } catch (e) {
        if (isIOS) {
          document.getElementById('storeLink')
            .setAttribute('href', 'https://apps.apple.com/app/id6783810617');
        }
      }
      // 진입 즉시 1회 자동 시도(사용자 제스처 없이 차단되는 브라우저도 있어 버튼 병행).
      window.location.href = scheme;
    })();
  </script>
